<main class="page-shell"><section class="picker-card" aria-label="128 color picker"><div class="intro"><div class="eyebrow"><span class="eyebrow-dot"></span>Color studio</div><h1>Find your <em>color.</em></h1><p>Explore a curated palette of 128 vivid shades, then copy the exact value you need.</p></div><div class="workspace"><div class="palette-panel"><div class="panel-heading"><div><h2>All colors</h2><span>16 hues · 8 shades</span></div><span class="count-badge">128</span></div><div class="swatch-grid" role="list" aria-label="Available colors"><button *ngFor="let color of colors" class="swatch" [class.selected]="selected.hex === color.hex" [style.--swatch]="color.hsl" [attr.aria-label]="'Choose ' + color.hex" [attr.aria-pressed]="selected.hex === color.hex" (click)="choose(color)"><span *ngIf="selected.hex === color.hex" class="check">✓</span></button></div><div class="legend"><span class="legend-line"></span>Click a swatch to select</div></div><aside class="details-panel"><div class="preview" [style.--selected]="selected.hex"><span>Selected color</span><strong>{{ selected.hex }}</strong></div><div class="details-content"><label class="field-label" for="hex-value">HEX value</label><div class="hex-entry"><span>#</span><input id="hex-value" [value]="hexInput" maxlength="6" (input)="hexInput = $any($event.target).value" (change)="applyHex()" (keydown.enter)="applyHex()" aria-label="HEX color value"><button class="apply-button" (click)="applyHex()">Apply</button></div><div class="value-list"><div class="value-row"><span>RGB</span><code>{{ selectedRgb.r }}, {{ selectedRgb.g }}, {{ selectedRgb.b }}</code></div><div class="value-row"><span>HSL</span><code>{{ selectedHsl }}</code></div></div><button class="copy-button" (click)="copyHex()"><span>{{ copied ? '✓' : '⧉' }}</span>{{ copied ? 'Copied to clipboard' : 'Copy HEX value' }}</button></div></aside></div></section></main>
